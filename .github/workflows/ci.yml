name: Skill offline checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skill-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate distributable and run offline tests
        run: npm test
      - name: Check package allowlist without publishing or lifecycle hooks
        run: npm pack --dry-run --ignore-scripts
# No API key, paid requests, privileged checkout, app deploy or live browser QA.
